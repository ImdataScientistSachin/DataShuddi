services:

  # ─── Qdrant Vector Database ──────────────────────────────────────────────
  qdrant:
    image: qdrant/qdrant:v1.13.0
    container_name: datashuddi_qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"   # REST API
      - "6334:6334"   # gRPC
    volumes:
      - ./data/qdrant_storage:/qdrant/storage
    environment:
      - QDRANT__LOG_LEVEL=INFO
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ─── PostgreSQL (LangGraph PostgresSaver Checkpointer) ───────────────────
  postgres:
    image: postgres:16-alpine
    container_name: datashuddi_postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    volumes:
      - ./data/postgres_data:/var/lib/postgresql/data
      - ./scripts/db_init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    environment:
      POSTGRES_DB: datashuddi
      POSTGRES_USER: datashuddi_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-datashuddi_pass}
      PGDATA: /var/lib/postgresql/data/pgdata


    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U datashuddi_user -d datashuddi"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # ─── DataShuddi FastAPI REST API Microservice ───────────────────────────
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: datashuddi_api
    restart: unless-stopped
    ports:
      - "8000:8000"   # FastAPI REST API & Swagger UI
      - "8501:8501"   # Streamlit Monitoring Dashboard
    environment:
      - POSTGRES_HOST=postgres
      - QDRANT_HOST=qdrant
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_started

networks:
  default:
    name: datashuddi_network

