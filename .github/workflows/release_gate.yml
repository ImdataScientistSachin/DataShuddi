name: Golden Dataset Release Gate & Integration

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integration-and-release-gate:
    name: 50-Doc Golden Release Gate & Full Pipeline Integration
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .

      - name: Download SpaCy Language Model
        run: |
          python -m spacy download en_core_web_lg

      - name: Run Full Pipeline Integration Tests
        run: |
          pytest tests/integration/ -v

      - name: Run Golden Dataset Safety Gate
        run: |
          pytest tests/test_release_gate.py -v
