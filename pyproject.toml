[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "datashuddi"
version = "3.0.0"
description = "Self-Correcting PII Scrubbing + Validation Agent"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "langgraph==0.2.73",
    "langchain==0.3.20",
    "langchain-community==0.3.19",
    "langchain-core==0.3.42",
    "langgraph-checkpoint-postgres==2.0.13",
    "psycopg==3.2.3",
    "psycopg-binary==3.2.3",
    "psycopg-pool==3.2.3",
    "ollama==0.4.7",
    "presidio-analyzer==2.2.356",
    "presidio-anonymizer==2.2.356",
    "spacy==3.8.3",
    "pymupdf==1.25.1",
    "python-docx==1.1.2",
    "paddleocr==3.7.0",
    "qdrant-client==1.13.2",
    "pydantic==2.10.6",
    "pydantic-settings==2.7.1",
    "fastapi==0.115.8",
    "uvicorn[standard]==0.34.0",
    "python-multipart==0.0.20",
    "streamlit==1.35.0",
    "loguru==0.7.3",
    "python-dotenv==1.0.1",
]

[tool.setuptools.packages.find]
where = ["."]

[tool.pyright]
include = ["src", "tests", "scripts", "streamlit_app"]
venvPath = "."
venv = ".venv"
pythonVersion = "3.11"
extraPaths = ["."]
executionEnvironments = [
  { root = "." }
]


[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # Pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501", # Line too long (handled by formatter)
    "E402", # Module level import not at top of file (sys.path bootstrap required)
]

[tool.ruff.lint.isort]
known-first-party = ["src"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = false
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true

[[tool.mypy.overrides]]
module = [
    "presidio_analyzer.*",
    "presidio_anonymizer.*",
    "fitz.*",
    "paddleocr.*",
    "docx.*",
    "streamlit.*",
    "streamlit_aggrid.*",
    "loguru.*",
    "ollama.*",
    "qdrant_client.*",
    "psycopg2.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --strict-markers"
markers = [
    "unit: Unit tests for individual components and nodes",
    "integration: Integration tests for graph execution",
    "release_gate: CI/CD release gate evaluation tests",
]
